<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      color: #fff;
      background: linear-gradient(160deg, #4a90e2 0%, #87b8f0 100%);
      background-attachment: fixed;
      transition: background 1s ease;
      padding: 24px 16px 48px;
    }
    /* Background changes with the weather */
    body.clear-day   { background: linear-gradient(160deg, #2f80ed 0%, #56ccf2 100%); }
    body.clear-night { background: linear-gradient(160deg, #0f2027 0%, #203a43 50%, #2c5364 100%); }
    body.cloudy      { background: linear-gradient(160deg, #616f84 0%, #a3b1c6 100%); }
    body.rain        { background: linear-gradient(160deg, #314755 0%, #26a0da 100%); }
    body.storm       { background: linear-gradient(160deg, #232526 0%, #414345 100%); }
    body.snow        { background: linear-gradient(160deg, #83a4d4 0%, #b6fbff 100%); }

    .app { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

    /* Frosted glass card */
    .glass {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 22px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      padding: 16px 18px;
    }

    .search { display: flex; gap: 8px; padding: 8px; }
    .search input {
      flex: 1; min-width: 0;
      background: transparent; border: none; outline: none;
      color: #fff; font-size: 16px; padding: 8px 10px;
    }
    .search input::placeholder { color: rgba(255, 255, 255, 0.7); }
    .search button {
      background: rgba(255, 255, 255, 0.25); border: none; color: #fff;
      border-radius: 14px; padding: 8px 16px; font-size: 15px; cursor: pointer;
    }
    .search button:hover { background: rgba(255, 255, 255, 0.35); }

    .current { text-align: center; padding: 28px 18px; }
    .current .city { font-size: 30px; font-weight: 500; }
    .current .temp { font-size: 96px; font-weight: 200; line-height: 1.05; }
    .current .desc { font-size: 20px; opacity: 0.9; }
    .current .hilo { font-size: 17px; margin-top: 4px; }

    .label {
      font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em;
      opacity: 0.7; padding-bottom: 10px; margin-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .hourly { display: flex; gap: 22px; overflow-x: auto; padding-bottom: 4px; }
    .hour { display: flex; flex-direction: column; align-items: center; gap: 8px; flex-shrink: 0; font-size: 15px; }
    .hour .icon { font-size: 24px; }

    .day {
      display: grid; grid-template-columns: 60px 36px 1fr; align-items: center;
      padding: 10px 0; font-size: 17px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }
    .day:last-child { border-bottom: none; }
    .day .icon { font-size: 22px; }
    .day .range { text-align: right; }
    .day .range .min { opacity: 0.65; margin-right: 12px; }

    .tide-readout { font-size: 17px; margin-bottom: 6px; }
    .tide-readout .h { font-weight: 600; }
    #tide-chart { width: 100%; height: auto; display: block; cursor: ew-resize; touch-action: pan-y; }
    #tide-chart text { fill: #fff; font-size: 10px; }
    #tide-chart .axis { opacity: 0.7; }
    .tide-note { font-size: 12px; opacity: 0.65; margin-top: 6px; }

    #radar-map { height: 320px; border-radius: 14px; overflow: hidden; background: #1b2530; }
    .radar-controls { display: flex; align-items: center; gap: 12px; margin-top: 10px; font-size: 15px; }
    .radar-controls button {
      background: rgba(255, 255, 255, 0.25); border: none; color: #fff;
      border-radius: 12px; padding: 6px 14px; font-size: 15px; cursor: pointer;
    }
    .leaflet-control-attribution { font-size: 10px; }

    .details { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .details .value { font-size: 28px; font-weight: 400; margin-top: 4px; }

    .message { text-align: center; opacity: 0.9; }
    .hidden { display: none; }
  </style>
</head>
<body class="clear-day">
  <main class="app">
    <form class="glass search" id="search-form">
      <input id="search-input" type="text" placeholder="Search for a city" autocomplete="off">
      <button type="submit">Search</button>
    </form>

    <p class="glass message" id="message">Loading…</p>

    <div id="weather" class="hidden">
      <section class="current">
        <div class="city" id="city"></div>
        <div class="temp" id="temp"></div>
        <div class="desc" id="desc"></div>
        <div class="hilo" id="hilo"></div>
      </section>

      <section class="glass">
        <div class="label">Hourly forecast</div>
        <div class="hourly" id="hourly"></div>
      </section>

      <section class="glass" style="margin-top:16px">
        <div class="label">7-day forecast</div>
        <div id="daily"></div>
      </section>

      <section class="glass hidden" id="tides" style="margin-top:16px">
        <div class="label">Tides</div>
        <div class="tide-readout" id="tide-readout"></div>
        <svg id="tide-chart" viewBox="0 0 360 190"></svg>
        <div class="tide-note">Height vs. mean sea level · model estimate, not for navigation · drag across the chart</div>
      </section>

      <section class="glass" id="radar" style="margin-top:16px">
        <div class="label">Rain radar · last ~80 min</div>
        <div id="radar-map"></div>
        <div class="radar-controls">
          <button type="button" id="radar-play">Pause</button>
          <span id="radar-time"></span>
        </div>
      </section>

      <section class="details" style="margin-top:16px">
        <div class="glass"><div class="label">Feels like</div><div class="value" id="feels"></div></div>
        <div class="glass"><div class="label">Humidity</div><div class="value" id="humidity"></div></div>
        <div class="glass"><div class="label">Wind</div><div class="value" id="wind"></div></div>
        <div class="glass"><div class="label">Rain chance</div><div class="value" id="rain"></div></div>
      </section>
    </div>
  </main>

  <script>
    // Default location: Boca Raton, FL
    const DEFAULT_PLACE = { name: "Boca Raton", latitude: 26.3683, longitude: -80.1289 };

    // Open-Meteo weather codes -> description, icon, background theme
    // https://open-meteo.com/en/docs (WMO weather interpretation codes)
    function describe(code, isDay = 1) {
      if (code === 0)  return { text: "Clear", icon: isDay ? "☀️" : "🌙", theme: isDay ? "clear-day" : "clear-night" };
      if (code <= 2)   return { text: "Partly Cloudy", icon: isDay ? "⛅" : "☁️", theme: isDay ? "clear-day" : "clear-night" };
      if (code === 3)  return { text: "Cloudy", icon: "☁️", theme: "cloudy" };
      if (code <= 48)  return { text: "Fog", icon: "🌫️", theme: "cloudy" };
      if (code <= 57)  return { text: "Drizzle", icon: "🌦️", theme: "rain" };
      if (code <= 67)  return { text: "Rain", icon: "🌧️", theme: "rain" };
      if (code <= 77)  return { text: "Snow", icon: "❄️", theme: "snow" };
      if (code <= 82)  return { text: "Rain Showers", icon: "🌧️", theme: "rain" };
      if (code <= 86)  return { text: "Snow Showers", icon: "🌨️", theme: "snow" };
      return { text: "Thunderstorm", icon: "⛈️", theme: "storm" };
    }

    const $ = (id) => document.getElementById(id);

    function showMessage(text) {
      $("message").textContent = text;
      $("message").classList.remove("hidden");
    }

    async function loadWeather(place) {
      showMessage("Loading…");
      const url = "https://api.open-meteo.com/v1/forecast"
        + `?latitude=${place.latitude}&longitude=${place.longitude}`
        + "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day"
        + "&hourly=temperature_2m,weather_code,is_day"
        + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"
        + "&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto&forecast_days=7";

      // Tides: Open-Meteo Marine sea level (yesterday → tomorrow, so highs/lows near midnight are found)
      const tideUrl = "https://marine-api.open-meteo.com/v1/marine"
        + `?latitude=${place.latitude}&longitude=${place.longitude}`
        + "&hourly=sea_level_height_msl&timezone=auto&past_days=1&forecast_days=2";

      try {
        const [res, tideRes] = await Promise.all([fetch(url), fetch(tideUrl).catch(() => null)]);
        if (!res.ok) throw new Error();
        const data = await res.json();
        render(place, data);
        const tideData = tideRes && tideRes.ok ? await tideRes.json().catch(() => null) : null;
        renderTides(tideData, data.current.time);
        $("message").classList.add("hidden");
        showRadar(place);
      } catch {
        showMessage("Couldn't load the weather. Please try again.");
      }
    }

    // ---------- Tides ----------
    const M_TO_FT = 3.28084;
    let tide = null; // { v: hourly heights in ft (72 values), start: index of today 00:00 }

    function fmtTime(hour) {
      let mins = Math.round(hour * 60);
      const h = Math.floor(mins / 60) % 24, m = mins % 60;
      return `${h % 12 || 12}:${String(m).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`;
    }
    const fmtFt = (ft) => `${ft >= 0 ? "+" : "−"}${Math.abs(ft).toFixed(1)} ft`;

    // Smooth (Catmull-Rom) height at a fractional hour of today
    function heightAt(hour) {
      const v = tide.v, x = tide.start + hour, i = Math.floor(x), t = x - i;
      const p0 = v[i - 1], p1 = v[i], p2 = v[i + 1] ?? v[i], p3 = v[i + 2] ?? p2;
      return 0.5 * (2 * p1 + (p2 - p0) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t * t + (3 * p1 - p0 - 3 * p2 + p3) * t * t * t);
    }

    // Highs and lows today; a parabola through 3 hourly points estimates the exact time and height
    function findExtremes() {
      const v = tide.v, out = [];
      for (let i = tide.start; i < tide.start + 24; i++) {
        const a = v[i - 1], b = v[i], c = v[i + 1];
        const isHigh = b > a && b >= c, isLow = b < a && b <= c;
        if (!isHigh && !isLow) continue;
        const denom = a - 2 * b + c;
        const off = denom ? (a - c) / (2 * denom) : 0;
        const hour = i - tide.start + off;
        if (hour >= 0 && hour < 24) out.push({ hour, ft: b - (a - c) * off / 4, high: isHigh });
      }
      return out;
    }

    function renderTides(data, currentTime) {
      const section = $("tides");
      const today = currentTime.slice(0, 10);
      const times = data?.hourly?.time || [];
      const start = times.indexOf(`${today}T00:00`);
      const raw = data?.hourly?.sea_level_height_msl || [];
      // Need today plus one hour on each side; inland locations return nulls
      const slice = raw.slice(start - 1, start + 25);
      if (start < 1 || slice.length < 26 || slice.some((x) => x == null)) {
        tide = null;
        section.classList.add("hidden");
        return;
      }
      tide = { v: raw.map((m) => m * M_TO_FT), start };
      section.classList.remove("hidden");

      // Chart geometry (SVG viewBox units)
      const W = 360, L = 8, R = 352, T = 34, B = 140;
      const samples = [];
      for (let m = 0; m <= 24 * 60; m += 10) samples.push(heightAt(m / 60));
      const lo = Math.min(...samples), hi = Math.max(...samples), pad = (hi - lo) * 0.1 || 0.5;
      const X = (hour) => L + (hour / 24) * (R - L);
      const Y = (ft) => B - ((ft - (lo - pad)) / (hi - lo + 2 * pad)) * (B - T);

      const pts = samples.map((ft, k) => `${X(k / 6).toFixed(1)},${Y(ft).toFixed(1)}`);
      const extremes = findExtremes().map((e) => {
        const x = X(e.hour), y = Y(e.ft);
        const anchor = x < 50 ? "start" : x > W - 50 ? "end" : "middle";
        const ty = e.high ? y - 16 : y + 14;
        return `<circle cx="${x}" cy="${y}" r="3.5" fill="#fff"/>
          <text x="${x}" y="${ty}" text-anchor="${anchor}" font-weight="600">${e.high ? "▲" : "▼"} ${fmtFt(e.ft)}</text>
          <text x="${x}" y="${ty + 11}" text-anchor="${anchor}" class="axis">${fmtTime(e.hour)}</text>`;
      }).join("");
      const axis = [0, 6, 12, 18, 24].map((h) =>
        `<text x="${X(h)}" y="185" text-anchor="${h === 0 ? "start" : h === 24 ? "end" : "middle"}" class="axis">${h === 24 ? "12AM" : fmtTime(h).replace(":00 ", "")}</text>`).join("");

      $("tide-chart").innerHTML = `
        <defs><linearGradient id="tide-fill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient></defs>
        <polygon points="${L},${B} ${pts.join(" ")} ${R},${B}" fill="url(#tide-fill)"/>
        <polyline points="${pts.join(" ")}" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
        <line x1="${L}" y1="${B}" x2="${R}" y2="${B}" stroke="#fff" stroke-opacity="0.25"/>
        ${extremes}${axis}
        <line id="tide-cursor" y1="${T - 10}" y2="${B}" stroke="#fff" stroke-width="1.5" stroke-dasharray="3 3"/>
        <circle id="tide-dot" r="5.5" fill="#fff" stroke="rgba(0,0,0,0.25)" stroke-width="2"/>`;

      const nowHour = Number(currentTime.slice(11, 13)) + Number(currentTime.slice(14, 16)) / 60;
      tide.X = X; tide.Y = Y; tide.L = L; tide.R = R; tide.nowHour = nowHour;
      moveTideCursor(nowHour);
    }

    function moveTideCursor(hour) {
      hour = Math.min(24, Math.max(0, hour));
      const ft = heightAt(Math.min(hour, 23.999));
      const x = tide.X(hour);
      $("tide-cursor").setAttribute("x1", x);
      $("tide-cursor").setAttribute("x2", x);
      $("tide-dot").setAttribute("cx", x);
      $("tide-dot").setAttribute("cy", tide.Y(ft));
      const isNow = Math.abs(hour - tide.nowHour) < 1 / 60;
      $("tide-readout").innerHTML = `${isNow ? "Now" : fmtTime(hour)} · <span class="h">${fmtFt(ft)}</span>`;
    }

    // Drag (mouse or finger) across the chart to move the cursor
    const chart = $("tide-chart");
    function onPointer(e) {
      if (!tide || (e.type === "pointermove" && e.pointerType !== "mouse" && !e.buttons)) return;
      const box = chart.getBoundingClientRect();
      const vx = ((e.clientX - box.left) / box.width) * 360;
      moveTideCursor(((vx - tide.L) / (tide.R - tide.L)) * 24);
    }
    chart.addEventListener("pointerdown", onPointer);
    chart.addEventListener("pointermove", onPointer);
    chart.addEventListener("pointerleave", (e) => tide && e.pointerType === "mouse" && moveTideCursor(tide.nowHour));

    function render(place, data) {
      const c = data.current;
      const d = data.daily;
      const now = describe(c.weather_code, c.is_day);

      document.body.className = now.theme;
      $("city").textContent = place.name;
      $("temp").textContent = `${Math.round(c.temperature_2m)}°`;
      $("desc").textContent = now.text;
      $("hilo").textContent = `H:${Math.round(d.temperature_2m_max[0])}°  L:${Math.round(d.temperature_2m_min[0])}°`;
      $("feels").textContent = `${Math.round(c.apparent_temperature)}°`;
      $("humidity").textContent = `${c.relative_humidity_2m}%`;
      $("wind").textContent = `${Math.round(c.wind_speed_10m)} mph`;
      $("rain").textContent = `${d.precipitation_probability_max[0] ?? 0}%`;

      // Next 12 hours, starting from the current hour (times are in the location's local time)
      const h = data.hourly;
      const start = Math.max(0, h.time.findIndex((t) => t.slice(0, 13) === c.time.slice(0, 13)));
      $("hourly").innerHTML = h.time.slice(start, start + 12).map((t, i) => {
        const idx = start + i;
        const hour = Number(t.slice(11, 13));
        const label = i === 0 ? "Now" : `${hour % 12 || 12}${hour < 12 ? "AM" : "PM"}`;
        return `<div class="hour">
          <span>${label}</span>
          <span class="icon">${describe(h.weather_code[idx], h.is_day[idx]).icon}</span>
          <span>${Math.round(h.temperature_2m[idx])}°</span>
        </div>`;
      }).join("");

      $("daily").innerHTML = d.time.map((t, i) => {
        const name = i === 0 ? "Today" : new Date(t + "T12:00").toLocaleDateString("en-US", { weekday: "short" });
        return `<div class="day">
          <span>${name}</span>
          <span class="icon">${describe(d.weather_code[i]).icon}</span>
          <span class="range"><span class="min">${Math.round(d.temperature_2m_min[i])}°</span>${Math.round(d.temperature_2m_max[i])}°</span>
        </div>`;
      }).join("");

      $("weather").classList.remove("hidden");
    }

    // ---------- Rain radar (RainViewer, free for personal/educational use; max tile zoom 7) ----------
    let map, marker, frames = [], frameIdx = 0, playTimer = null;

    function showRadar(place) {
      if (!window.L) return $("radar").classList.add("hidden");
      if (!map) {
        map = L.map("radar-map", { zoomControl: false, maxZoom: 10, minZoom: 3 });
        L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a> · Radar <a href="https://www.rainviewer.com/">RainViewer</a>',
        }).addTo(map);
        marker = L.circleMarker([0, 0], { radius: 6, color: "#fff", weight: 2, fillColor: "#2f80ed", fillOpacity: 1 }).addTo(map);
        map.setView([place.latitude, place.longitude], 7);
        loadRadarFrames();
      }
      map.invalidateSize();
      map.setView([place.latitude, place.longitude], 7);
      marker.setLatLng([place.latitude, place.longitude]);
    }

    async function loadRadarFrames() {
      try {
        const res = await fetch("https://api.rainviewer.com/public/weather-maps.json");
        const data = await res.json();
        // Last 8 frames (~80 min) keeps tile requests under RainViewer's 100/minute limit
        frames = data.radar.past.slice(-8).map((f) => ({
          time: f.time,
          layer: L.tileLayer(`${data.host}${f.path}/512/{z}/{x}/{y}/2/1_1.png`, {
            tileSize: 512, zoomOffset: -1, maxNativeZoom: 8, opacity: 0,
          }).addTo(map),
        }));
        frameIdx = frames.length - 1;
        showFrame(frameIdx);
        play();
      } catch {
        $("radar-time").textContent = "Radar unavailable right now.";
      }
    }

    function showFrame(i) {
      frames.forEach((f, k) => f.layer.setOpacity(k === i ? 0.8 : 0));
      const t = new Date(frames[i].time * 1000).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
      $("radar-time").textContent = i === frames.length - 1 ? `${t} (latest)` : t;
    }

    function play() {
      clearInterval(playTimer);
      playTimer = setInterval(() => {
        frameIdx = (frameIdx + 1) % frames.length;
        showFrame(frameIdx);
      }, 600);
      $("radar-play").textContent = "Pause";
    }

    $("radar-play").addEventListener("click", () => {
      if (!frames.length) return;
      if (playTimer) {
        clearInterval(playTimer);
        playTimer = null;
        $("radar-play").textContent = "Play";
      } else {
        play();
      }
    });

    // City search via Open-Meteo's free geocoding API
    $("search-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const query = $("search-input").value.trim();
      if (!query) return;
      showMessage("Searching…");
      try {
        const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en`);
        const data = await res.json();
        const r = data.results && data.results[0];
        if (!r) return showMessage(`No results for "${query}".`);
        $("search-input").value = "";
        loadWeather({ name: r.name, latitude: r.latitude, longitude: r.longitude });
      } catch {
        showMessage("Search failed. Please try again.");
      }
    });

    loadWeather(DEFAULT_PLACE);
  </script>
</body>
</html>
